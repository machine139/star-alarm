name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 檢出程式碼
        uses: actions/checkout@v4

      - name: 設定 Node.js 環境
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 設定 Java 17 (JDK)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 設定 Gradle 快取與環境
        uses: gradle/actions/setup-gradle@v3

      - name: 初始化 Capacitor 並配置 Android 原生鬧鐘
        run: |
          mkdir -p www
          cp index.html www/
          npm init -y
          npm install @capacitor/core@latest @capacitor/cli@latest @capacitor/android@latest
          npx cap init "星空鬧鐘" com.staralarm.app --web-dir www
          
          # 將 App 指向 GitHub Pages（若有斷網時自動讀取本地備援）
          cat << 'EOF' > capacitor.config.json
          {
            "appId": "com.staralarm.app",
            "appName": "星空鬧鐘",
            "webDir": "www",
            "server": {
              "androidScheme": "https"
            }
          }
          EOF

          # 建立 Android 原生專案
          npx cap add android

          # 注入 Android 系統精確鬧鐘與喚醒權限
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          sed -i '/<\/manifest>/i \    <uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM" />' $MANIFEST
          sed -i '/<\/manifest>/i \    <uses-permission android:name="android.permission.USE_EXACT_ALARM" />' $MANIFEST
          sed -i '/<\/manifest>/i \    <uses-permission android:name="android.permission.WAKE_LOCK" />' $MANIFEST
          sed -i '/<\/manifest>/i \    <uses-permission android:name="android.permission.USE_FULL_SCREEN_INTENT" />' $MANIFEST
          sed -i '/<\/manifest>/i \    <uses-permission android:name="android.permission.VIBRATE" />' $MANIFEST
          sed -i '/<\/manifest>/i \    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />' $MANIFEST
          sed -i '/<\/manifest>/i \    <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED" />' $MANIFEST

      - name: 自動接受 Android SDK 授權
        run: |
          yes | sdkmanager --licenses || true

      - name: 編譯 Android Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: 上傳打包好的 APK 成品
        uses: actions/upload-artifact@v4
        with:
          name: StarAlarm-Android-Debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
