name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 1. 檢出程式碼
        uses: actions/checkout@v4

      - name: 2. 設定 Java 17 (JDK)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 3. 設定 Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 4. 準備 Web 資源與初始化 Capacitor
        run: |
          mkdir -p www
          cp index.html www/
          
          # 初始化乾淨的 package.json
          npm init -y
          
          # 安裝指定相容版本的 Capacitor 核心與 Android 插件
          npm install @capacitor/core@latest @capacitor/cli@latest @capacitor/android@latest
          
          # 建立標準 JSON 配置 (避免 TS 衝突)
          cat << 'EOF' > capacitor.config.json
          {
            "appId": "com.staralarm.app",
            "appName": "星空鬧鐘",
            "webDir": "www",
            "server": {
              "androidScheme": "https"
            }
          }
          EOF

          # 加入 Android 原生專案並同步
          npx cap add android
          npx cap sync android

          # 注入 Android 系統精確鬧鐘與背景喚醒權限
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          sed -i '/<\/manifest>/i \    <uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM" />' $MANIFEST
          sed -i '/<\/manifest>/i \    <uses-permission android:name="android.permission.USE_EXACT_ALARM" />' $MANIFEST
          sed -i '/<\/manifest>/i \    <uses-permission android:name="android.permission.WAKE_LOCK" />' $MANIFEST
          sed -i '/<\/manifest>/i \    <uses-permission android:name="android.permission.USE_FULL_SCREEN_INTENT" />' $MANIFEST
          sed -i '/<\/manifest>/i \    <uses-permission android:name="android.permission.VIBRATE" />' $MANIFEST
          sed -i '/<\/manifest>/i \    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />' $MANIFEST
          sed -i '/<\/manifest>/i \    <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED" />' $MANIFEST

      - name: 5. 編譯 Android Debug APK (Gradle)
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: 6. 上傳打包好的 APK 成品
        uses: actions/upload-artifact@v4
        with:
          name: StarAlarm-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
